fff6e8}#steps li.ready{color:#333;cursor:pointer}#steps li.ready .st{color:var(--accent)}#steps .dotc{width:10px;height:10px;border-radius:50%;border:1px solid #0003;flex:none}#steps .lbl{flex:1}#steps .st{font-size:11px;font-weight:700;color:#999}#steps li.done .st{color:#2e7d32}#steps li.next .st{color:var(--accent)}#help{position:absolute;top:0;right:0;bottom:0;left:0;background:#000c;color:#fff;padding:24px;overflow:auto;display:none;font-size:13px;line-height:1.7;z-index:30}#help.show{display:block}#help .helpbox{max-width:640px;margin:0 auto}#help h2{margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;font-size:18px}#help h3{margin:20px 0 8px;font-size:14px;color:#cfd3d9}#helpClose{background:#ffffff1c;border:0;color:#fff;font-size:15px;width:34px;height:34px;border-radius:8px;cursor:pointer}#help ol.flow{margin:0;padding-left:20px}#help ol.flow li{margin:4px 0}#help kbd{background:#333;border:1px solid #666;border-radius:4px;padding:1px 6px;font-family:monospace}#help table{border-collapse:collapse}#help td{padding:3px 14px 3px 0;vertical-align:top}#help .closeHint{color:#9aa0a8;margin-top:18px}.touchonly{display:none}#zoomctl{flex-direction:column;gap:8px;position:absolute;left:10px;top:56px;z-index:20}#zoomctl button{width:44px;height:44px;border:1px solid #ffffff26;border-radius:10px;background:#111214b8;color:#fff;font-size:19px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}#zoomctl button:disabled{opacity:.35}#nudgepad{position:absolute;right:10px;bottom:12px;z-index:20;flex-direction:column;align-items:center;gap:4px;background:#111214b8;border:1px solid #ffffff26;border-radius:12px;padding:8px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}#nudgeClose{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border:1px solid #ffffff33;border-radius:50%;background:#2c2e33;color:#fff;font-size:12px;line-height:1;cursor:pointer}#nudgeLabel{color:#fff;font-size:10.5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#nudgepad .pad{display:grid;gap:3px;grid-template-areas:". u ." "l . r" ". d ."}#nudgepad .pad button{width:36px;height:36px;border:0;border-radius:8px;background:#ffffff1e;color:#fff;font-size:13px;cursor:pointer}#nudgepad .pad .u{grid-area:u}#nudgepad .pad .d{grid-area:d}#nudgepad .pad .l{grid-area:l}#nudgepad .pad .r{grid-area:r}#bottomnav{display:none}#footer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:5px 10px;background:var(--bg);color:#bbb;font-size:11px;border-top:1px solid var(--line)}#footer a{color:#7ab7ff;text-decoration:none}#footer a:hover{text-decoration:underline}#footer .research{color:#ffb74d;font-weight:600}#footer .grow{margin-left:auto}#footer #dlLocal{background:var(--accent);color:#fff;padding:4px 10px;border-radius:6px}#footer #dlLocal:hover{background:var(--accent-h);text-decoration:none}@media(hover:none)and (pointer:coarse){.hk,.pconly{display:none}#zoomctl,#nudgepad.show{display:flex}#toolbar button{min-height:44px}#toolbar input[type=text]{font-size:16px;min-height:44px}#steps li{min-height:44px}}@media(max-width:780px){.hk,.nomobile{display:none}#toolbar{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));-webkit-overflow-scrolling:touch;scrollbar-width:none}#toolbar::-webkit-scrollbar{display:none}.tbside{flex-wrap:nowrap;flex:0 0 auto}#tbRight{margin-left:0}#toolbar button{padding:9px 12px;font-size:13px}.toolgroup:has(#btnOpen){order:-2}#btnHome{order:-3;padding:9px 12px;font-size:13px}#toolbar input[type=text]{width:130px}.tbfade{display:flex;align-items:center;justify-content:flex-end;position:sticky;right:0;order:99;flex:0 0 34px;margin-left:-34px;align-self:stretch;pointer-events:none;color:#cfd3d9;font-size:16px;background:linear-gradient(90deg,transparent,var(--bg) 70%);opacity:1;transition:opacity .15s}#toolbar.scroll-end .tbfade{opacity:0}#status{font-size:12px;padding:7px 13px}#zoomctl{top:128px}#bottomnav{display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 10px max(8px,env(safe-area-inset-bottom));gap:8px}#bottomnav button{border:0;border-radius:10px;background:var(--bg3);color:#fff;cursor:pointer;min-height:44px;font-size:14px;white-space:nowrap}#bottomnav #navPrev,#bottomnav #navNext{flex:0 0 54px;font-size:17px}#bottomnav #navRecord{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}#bottomnav #navPanel{flex:0 0 auto;padding:0 14px}#bottomnav button:disabled{opacity:.4;cursor:default}#bottomnav button:active:not(:disabled){opacity:.75}#bottomnav .accent{background:var(--accent)}#sidebar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));width:auto;max-height:62vh;border-radius:14px 14px 0 0;box-shadow:0 -3px 14px #0005;transform:translateY(calc(100% + var(--nav-h) + env(safe-area-inset-bottom,0px)));transition:transform .25s ease;z-index:25}body.panel-open #sidebar{transform:translateY(0)}body.panel-open #backdrop{display:block;cursor:pointer}body.panel-open #nudgepad{display:none}#footer{padding:4px 10px;font-size:10px;gap:4px;flex-wrap:nowrap;min-width:0}#footer .research{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#footer a{display:none}}@media(min-width:781px)and (max-width:1511px){.hk{display:none}}@media(max-height:520px){#toolbar{padding-top:max(4px,env(safe-area-inset-top));padding-bottom:4px}#toolbar button{padding:5px 9px}#footer{font-size:10px;padding:3px 10px;flex-wrap:nowrap;min-width:0}#footer .research{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hud{top:6px;flex-direction:row;justify-content:center;align-items:center}#status{max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;padding:5px 12px}#counter{white-space:nowrap}#zoomctl{flex-direction:row;top:auto;bottom:8px;left:8px}#zoomctl button{width:38px;height:38px;font-size:16px}#nudgepad{padding:6px;bottom:8px}#nudgepad .pad button{width:30px;height:30px;font-size:11px}#nudgeLabel{display:none}}</style>

<body data-preset="cervical">
  <div id="toolbar">
    <div class="tbside" id="tbLeft">
      <a href="../../" id="btnHome" class="tbhome" title="ホームに戻る">⌂ ホーム</a>
      <div class="toolgroup">
        <button id="btnOpen" title="画像を開く（複数選択可）">📂 画像を開く<span class="hk"> (O)</span></button>
      </div>
      <div class="toolgroup" id="grpRotate">
        <button class="dataonly" id="btnRotL" title="左に90°回転 (⇧R)">⟲ 左90<span class="hk"> (⇧R)</span></button>
        <button class="dataonly" id="btnRotR" title="右に90°回転 (R)">⟳ 右90<span class="hk"> (R)</span></button>
        <button class="dataonly" id="btnFlip" title="左右反転 (F)">⇋ 反転<span class="hk"> (F)</span></button>
        <button class="dataonly" id="btnUndo" title="直前の点を取消 (Z)">↩ 取消<span class="hk"> (Z)</span></button>
      </div>
    </div>
    <div class="tbside" id="tbRight">
      <label class="idlabel" title="CSVに記録される症例ID（ファイル名から自動入力）">ID <input type="text" id="caseId" placeholder="case001"></label>
      <div class="toolgroup nomobile">
        <button class="dataonly" id="btnPrev" title="前の画像 (P)" aria-label="前の画像">←<span class="hk"> (P)</span></button>
        <button class="dataonly accent" id="btnRecord" title="計測結果を蓄積して次の画像へ (Enter)">✓ 記録して次へ<span class="hk"> (Enter)</span></button>
        <button class="dataonly" id="btnNext" title="次の画像 (N)" aria-label="次の画像">→<span class="hk"> (N)</span></button>
      </div>
      <div class="toolgroup">
        <button id="btnCsv" title="蓄積した全結果をCSVで保存 (D)">⬇ CSV保存<span class="hk"> (D)</span></button>
      </div>
      <button id="btnHelp" title="ヘルプ (?)">? ヘルプ</button>
    </div>
    <div class="tbfade" aria-hidden="true">›</div>
  </div>

  <div id="main">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="empty">
        <div class="dropbox" role="button" tabindex="0">
          <button id="btnEmptyOpen">📂 画像を開く</button>
          <div class="hint">複数ファイル選択可・DICOM対応<span class="pconly">・フォルダのドラッグ&ドロップ対応</span></div>
        </div>
      </div>
      <div id="hud">
        <div id="status" role="status">画像を開いて計測を開始</div>
        <span id="counter" hidden>画像なし</span>
      </div>
      <div id="backdrop"></div>
      <div id="zoomctl" class="touchonly">
        <button class="dataonly" id="btnZoomIn" aria-label="拡大">＋</button>
        <button class="dataonly" id="btnZoomOut" aria-label="縮小">－</button>
        <button class="dataonly" id="btnFit" aria-label="全体表示">⊡</button>
        <button class="dataonly" id="btnUndoFloat" aria-label="直前の点を取消">↩</button>
      </div>
      <div id="nudgepad" class="touchonly" aria-label="選択点の微調整">
        <button id="nudgeClose" aria-label="微調整パッドを閉じる">✕</button>
        <span id="nudgeLabel"></span>
        <div class="pad">
          <button class="u" data-dx="0" data-dy="-1" aria-label="上へ1px">▲</button>
          <button class="l" data-dx="-1" data-dy="0" aria-label="左へ1px">◀</button>
          <button class="r" data-dx="1" data-dy="0" aria-label="右へ1px">▶</button>
          <button class="d" data-dx="0" data-dy="1" aria-label="下へ1px">▼</button>
        </div>
      </div>
      <div id="help" role="dialog" aria-modal="true" aria-label="使い方"></div>
    </div>
    <div id="sidebar">
      <section>
        <h3>計測値</h3>
        <div class="metrics" id="metrics"></div>
        <div id="svaInfo" class="note"></div>
        <div class="extras" id="extras"></div>
        <button class="dataonly" id="btnSaveImg" title="補助線と計測値を焼き込んだ画像を保存">🖼 画像保存（計測値付き）</button>
      </section>
      <section>
        <h3>ランドマーク</h3>
        <ol id="steps"></ol>
      </section>
      <section>
        <h3>定義</h3>
        <div class="note">
          C2C7_angle: C2下終板とC7下終板のCobb角（前弯=正）<br>
          T1S: T1上終板と水平線の角度<br>
          SVA: C2椎体中心とC7上後隅角の水平距離
        </div>
        <div class="note privacy">画像は端末外に送信されません（ローカル処理）。</div>
      </section>
    </div>
  </div>

  <footer id="footer">
    <span class="research">⚠ 研究用途のみ ／ 本ツールは医療機器ではありません。臨床診断・治療には使用しないでください。</span>
    <a href="https://github.com/masaki39/spine-web" target="_blank" rel="noopener">GitHub</a>
    <a href="https://github.com/masaki39/spine-web/blob/main/LICENSE" target="_blank" rel="noopener">License: Apache-2.0</a>
    <a id="dlLocal" class="grow" href="./index.html" download="cervical-analyzer.html">⬇ ローカル版をダウンロード</a>
  </footer>

  <nav id="bottomnav">
    <button class="dataonly" id="navPrev" aria-label="前の画像">←</button>
    <button class="dataonly accent" id="navRecord">✓ 記録して次へ</button>
    <button class="dataonly" id="navNext" aria-label="次の画像">→</button>
    <button id="navPanel" aria-expanded="false">📊 計測値</button>
  </nav>

  <input type="file" id="fileInput" multiple style="display:none">

</body>
</html>
